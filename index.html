<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Stock - Lucía Martín</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800">

  <!-- Menú de Navegación -->
  <header class="bg-blue-600 p-4">
    <nav class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="#" class="text-white text-xl font-bold">Mi Emprendimiento</a>
      <ul class="flex space-x-6">
        <li><a href="#stock" class="text-white hover:text-gray-300">Stock</a></li>
        <li><a href="#compras" class="text-white hover:text-gray-300">Compras</a></li>
        <li><a href="#ventas" class="text-white hover:text-gray-300">Ventas</a></li>
        <li><a href="#reportes" class="text-white hover:text-gray-300">Reportes</a></li>
      </ul>
    </nav>
  </header>

  <!-- Sección de Stock -->
  <section id="stock" class="p-8">
    <h2 class="text-2xl font-bold mb-4">Gestión de Stock</h2>
    <form id="form-stock">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <form action="https://script.google.com/macros/s/AKfycbxqnMpkPHB4Xa0eDqxdTKy_MO0gZEVXWG_Q95DIP-2bcQwtVTb33dnKAjzFcY2pHnLQcw/exec" method="POST">
        <!-- Categoría -->
        <label for="categoria">Categoría:</label>
        <select id="categoria" name="categoria" class="p-2 border rounded" onchange="mostrarCamposPorCategoria()">
          <option value="">Seleccionar</option>
          <option value="Pañales">Pañales</option>
          <option value="Higiene">Higiene</option>
          <option value="Accesorios">Accesorios</option>
        </select>
      </div>

      <!-- Marca -->
      <div id="campo-marca" class="hidden mt-4">
        <label for="marca">Marca:</label>
        <select id="marca" name="marca" class="p-2 border rounded" onchange="cargarLineas()">
          <option value="">Seleccionar</option>
          <option value="Huggies">Huggies</option>
          <option value="Pampers">Pampers</option>
          <option value="Babysec">Babysec</option>
          <option value="Duffy">Duffy</option>
          <option value="Estrella en Pañales">Estrella en Pañales</option>
          <option value="Otra">Otra (escribir)</option>
        </select>
        <input type="text" id="marca-manual" name="marca-manual" class="p-2 border rounded mt-2 hidden" placeholder="Especificar marca" />
      </div>

      <!-- Línea -->
      <div id="campo-linea" class="hidden mt-4">
        <label for="linea">Línea / Variante:</label>
        <select id="linea" name="linea" class="p-2 border rounded">
          <option value="">Seleccionar línea / variante</option>
        </select>
        <input type="text" id="linea-manual" name="linea-manual" class="p-2 border rounded mt-2 hidden" placeholder="Especificar línea" />
      </div>

      <!-- Talle -->
      <div id="campo-talle" class="hidden mt-4">
        <label for="talle">Talle:</label>
        <select id="talle" name="talle" class="p-2 border rounded">
          <option value="RN">RN</option>
          <option value="P">P</option>
          <option value="M">M</option>
          <option value="G">G</option>
          <option value="XG">XG</option>
          <option value="XXG">XXG</option>
          <option value="XXXG">XXXG</option>
        </select>
      </div>

      <!-- Detalle, cantidad, precio, etc -->
      <label for="detalle" class="mt-4">Detalle / Tamaño (opcional):</label>
      <input type="text" name="detalle" id="detalle" class="p-2 border rounded mb-4" placeholder="Ej: 100ml, 20 unidades, etc." />

      <label for="cantidad">Cantidad comprada:</label>
      <input type="number" name="cantidad" id="cantidad" class="p-2 border rounded mb-4" required />

      <label for="precio">Precio unitario ($):</label>
      <input type="number" name="precio" id="precio" class="p-2 border rounded mb-4" step="0.01" required />

      <label for="fecha">Fecha de compra:</label>
      <input type="date" name="fecha" id="fecha" class="p-2 border rounded mb-4" />

      <label for="observaciones">Observaciones:</label>
      <textarea name="observaciones" id="observaciones" class="p-2 border rounded mb-4" rows="2" placeholder="Proveedor, flete, promos..."></textarea>

      <button type="submit" class="bg-blue-600 text-white p-2 rounded mt-4">Agregar al Stock</button>
    </form>
  </section>

  <!-- Secciones futuras -->
  <section id="compras" class="p-8 bg-gray-200">
    <h2 class="text-2xl font-bold mb-4">Registrar Compras</h2>
  </section>

  <section id="ventas" class="p-8">
    <h2 class="text-2xl font-bold mb-4">Registrar Ventas</h2>
  </section>

  <section id="reportes" class="p-8 bg-gray-200">
    <h2 class="text-2xl font-bold mb-4">Reportes y Ganancias</h2>
  </section>

  <footer class="bg-blue-600 p-4 text-center text-white">
    <p>&copy; 2025 Lucía Martín - Todos los derechos reservados</p>
  </footer>

  <!-- Scripts -->
  <script>
    const lineasPorMarca = {
      "Huggies": ["Natural Care", "Tripack", "Active Sec", "Classic", "Protect Plus"],
      "Pampers": ["Confort Sec", "Premium Care", "Recién Nacido"],
      "Babysec": ["Ultra", "Premium", "Super Premium"],
      "Duffy": ["Clásico", "Premium", "Gel Plus"],
      "Estrella en Pañales": ["Económico", "Día y Noche", "Premium"]
    };

    function mostrarCamposPorCategoria() {
      const categoria = document.getElementById("categoria").value;
      document.getElementById("campo-marca").style.display = categoria ? "block" : "none";
      document.getElementById("campo-linea").style.display = categoria ? "block" : "none";
      document.getElementById("campo-talle").style.display = categoria === "Pañales" ? "block" : "none";
    }

    function cargarLineas() {
      const marca = document.getElementById("marca").value;
      const inputManual = document.getElementById("marca-manual");
      const lineaSelect = document.getElementById("linea");
      const lineaManual = document.getElementById("linea-manual");

      // Mostrar u ocultar input de marca manual
      inputManual.style.display = marca === "Otra" ? "block" : "none";

      // Limpiar opciones anteriores
      lineaSelect.innerHTML = '<option value="">Seleccionar línea / variante</option>';

      if (marca === "Otra") {
        lineaSelect.style.display = "none";
        lineaManual.style.display = "block";
        return;
      }

      lineaSelect.style.display = "block";
      lineaManual.style.display = "none";

      const lineas = lineasPorMarca[marca] || [];
      if (lineas.length === 0) {
        lineaManual.style.display = "block";
        lineaSelect.style.display = "none";
      } else {
        lineas.forEach(linea => {
          const option = document.createElement("option");
          option.value = linea;
          option.textContent = linea;
          lineaSelect.appendChild(option);
        });
      }
    }
  </script>
</body>
</html>
